services:
  - type: web
    name: mahaveer-tiles-marbles
    runtime: docker
    plan: standard
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/
    disk:
      name: business-uploads
      mountPath: /app/backend/media
      sizeGB: 10
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: mahaveer-tiles-marbles-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_OTP_TEMPLATE_ID
        sync: false

databases:
  - name: mahaveer-tiles-marbles-db
    databaseName: mahaveer_tiles_marbles
    user: mahaveer_app
    plan: basic-1gb
    region: oregon
    ipAllowList: []
